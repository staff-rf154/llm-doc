name: llm-doc

services:
  postgres:
    image: postgres:16
    container_name: llm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-llm}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    volumes:
      - ./qdrant/storage:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: llm-ollama
    profiles: ["local-llm"]
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1m}
    volumes:
      - ./ollama/models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: llm-app
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-docs}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_DISABLE_TELEMETRY=1
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - EMBED_BATCH=${EMBED_BATCH:-16}
      - DATABASE_URL=${DATABASE_URL}
      - BACKUP_DIR=/data/backups
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - APP_TITLE=${APP_TITLE:-База знаний}
      - DOMAIN_PROFILE=${DOMAIN_PROFILE:-general}
      - DOCS_BASE_URL=${DOCS_BASE_URL:-}
      - SITE_URL=${SITE_URL:-}
      # настраиваются в кабинете, значения по умолчанию — из .env
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-150}
      - RETRIEVE_TOP_K=${RETRIEVE_TOP_K:-5}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-0}
      - CORRECTIONS_COLLECTION=${CORRECTIONS_COLLECTION:-corrections}
      - CORRECTION_MATCH_THRESHOLD=${CORRECTION_MATCH_THRESHOLD:-0.86}
      - CORRECTION_EXAMPLES=${CORRECTION_EXAMPLES:-2}
      - CORRECTION_OVERLAP_WORDS=${CORRECTION_OVERLAP_WORDS:-2}
      - SYNONYMS_MAX_VARIANTS=${SYNONYMS_MAX_VARIANTS:-6}
      - LESSONS_COLLECTION=${LESSONS_COLLECTION:-lessons}
      - LESSONS_MAX=${LESSONS_MAX:-2}
      - LESSONS_MIN_SCORE=${LESSONS_MIN_SCORE:-0.75}
      - TRAINING_FROM_CORRECTIONS=${TRAINING_FROM_CORRECTIONS:-1}
      - WEB_CRAWL_MAX_PAGES=${WEB_CRAWL_MAX_PAGES:-2000}
      - WEB_CRAWL_TIMEOUT=${WEB_CRAWL_TIMEOUT:-20}
      - WEB_CRAWL_DELAY_MS=${WEB_CRAWL_DELAY_MS:-500}
      - WEB_CRAWL_RESPECT_ROBOTS=${WEB_CRAWL_RESPECT_ROBOTS:-1}
      - AUTOLEARN_WINDOW=${AUTOLEARN_WINDOW:-500}
      - AUTOLEARN_DAYS=${AUTOLEARN_DAYS:-30}
      - AUTOLEARN_TOPIC_THRESHOLD=${AUTOLEARN_TOPIC_THRESHOLD:-0.84}
      - AUTOLEARN_MIN_TOPIC_HITS=${AUTOLEARN_MIN_TOPIC_HITS:-3}
      - AUTOLEARN_LLM_LIMIT=${AUTOLEARN_LLM_LIMIT:-20}
      - AUTOLEARN_LLM_ENABLED=${AUTOLEARN_LLM_ENABLED:-1}
      - AUTOLEARN_MAX_TOPICS=${AUTOLEARN_MAX_TOPICS:-300}
      - PROMPTS_MAX=${PROMPTS_MAX:-8}
      - INGEST_WORKERS=${INGEST_WORKERS:-8}
      - INGEST_BATCH_SIZE=${INGEST_BATCH_SIZE:-64}
      - INGEST_CHECKPOINT_EVERY=${INGEST_CHECKPOINT_EVERY:-64}
      - SSE_HEARTBEAT=${SSE_HEARTBEAT:-10}
      - HYBRID_SPARSE=${HYBRID_SPARSE:-1}
      - HYBRID_CANDIDATES=${HYBRID_CANDIDATES:-12}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-1}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANKER_CANDIDATES=${RERANKER_CANDIDATES:-10}
      - RERANKER_MAX_LENGTH=${RERANKER_MAX_LENGTH:-512}
      - RERANKER_TOP_K=${RERANKER_TOP_K:-5}
      - EMBEDDER_DEVICE=${EMBEDDER_DEVICE:-auto}
      - RERANKER_DEVICE=${RERANKER_DEVICE:-auto}
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-100}
      - UPLOAD_URL_TIMEOUT=${UPLOAD_URL_TIMEOUT:-60}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://ollama:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - ./data/docs:/data/docs:rw
      - ./data/docs/upload:/data/docs/upload
      - ./data/eval:/data/eval
      - ./data/prompts:/data/prompts
      - ./data/index_state:/data/index_state
      - ./data/app:/data/app
      - ./data/settings:/data/settings
      - ./data/synonyms:/data/synonyms
      - ./data/backups:/data/backups
      - ./app/.cache:/app/.cache
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
