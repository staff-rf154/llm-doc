<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>База знаний</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a5;
    --accent: #4c8dff;
    --ok: #35c48b;
    --warn: #e0a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-top: 57px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    height: 100dvh;
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--panel);
    box-shadow: 0 1px 6px rgba(0, 0, 0, .35);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
  }
  .spacer { flex: 1; }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 13px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 8px;
  }
  #log-inner { max-width: 900px; margin: 0 auto; }
  .msg { margin-bottom: 22px; }
  .msg .who {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .msg.user .body { color: var(--text); font-weight: 500; }
  .msg.bot .body { color: var(--text); }
  .body { white-space: pre-wrap; }
  .msg.user .body {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px 14px;
  }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .grounded { color: var(--ok); }
  .ungrounded { color: var(--warn); }
  .corrected { color: var(--accent); }
  .reference { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .reference a { color: var(--accent); text-decoration: none; }
  .reference a:hover { text-decoration: underline; }
  .sources { margin-top: 10px; }
  .sources summary {
    cursor: pointer;
    font-size: 12px;
    color: var(--accent);
    user-select: none;
  }
  .src {
    border-left: 2px solid var(--border);
    padding: 7px 0 7px 12px;
    margin-top: 8px;
  }
  .src .meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .src .txt {
    font-size: 13px;
    color: var(--muted);
    white-space: pre-wrap;
    max-height: 130px;
    overflow: hidden;
    position: relative;
  }
  .src.open .txt { max-height: none; }
  .src-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .src-title { font-size: 13px; color: var(--text); font-weight: 500; }
  .src-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .tag {
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
    color: var(--muted);
  }
  .tag.high { color: var(--ok); border-color: var(--ok); }
  .tag.mid { color: var(--warn); border-color: var(--warn); }
  .tag.low { color: var(--muted); }
  .tag.web { color: var(--accent); border-color: var(--accent); }
  .src-more {
    font-size: 11px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 4px 0 0;
    cursor: pointer;
  }
  .ref-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cursor { display: inline-block; width: 7px; background: var(--accent); animation: b 1s steps(2) infinite; }
  @keyframes b { 50% { opacity: 0 } }
  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -1px 6px rgba(0, 0, 0, .35);
  }
  #app, #auth { padding-bottom: calc(108px + env(safe-area-inset-bottom)); }
  #form { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 13px;
    font: inherit;
    resize: none;
    max-height: 180px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { padding: 11px 22px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .hint { max-width: 900px; margin: 8px auto 0; font-size: 11px; color: var(--muted); }
  .hint-row {
    max-width: 900px;
    margin: 8px auto 0;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .hint-row .hint { margin: 0; }
  .examples { max-width: 900px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; gap: 8px; }
  .examples button { font-size: 12px; padding: 6px 11px; }
  .examples-title { width: 100%; font-size: 12px; color: var(--muted); }
  .capabilities {
    max-width: 900px;
    margin: 0 auto 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .capabilities h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .capabilities .group { margin-bottom: 12px; }
  .capabilities .group:last-child { margin-bottom: 0; }
  .capabilities .group-title { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
  .capabilities ul { margin: 0; padding-left: 18px; }
  .capabilities li { font-size: 13px; color: var(--muted); }
  #auth {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #auth[hidden], #app[hidden], header button[hidden], .reference[hidden], .rate[hidden] {
    display: none;
  }
  #app { flex: 1; display: flex; flex-direction: column; }
  #auth .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: min(340px, 100%);
  }
  #auth h2 { margin: 0 0 16px; font-size: 16px; }
  #auth input {
    width: 100%;
    margin-bottom: 10px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 11px;
    font: inherit;
  }
  #auth input:focus { outline: none; border-color: var(--accent); }
  #auth button { width: 100%; background: var(--accent); border-color: var(--accent); color: #fff; }
  #auth .err { color: var(--warn); font-size: 12px; margin-top: 10px; }
  .rate { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .rate button { padding: 4px 10px; font-size: 12px; }
  .rate button.active { border-color: var(--accent); color: var(--accent); }
  .rate .muted { width: 100%; margin-top: 4px; }
  .rate input {
    flex: 1;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 9px;
    font: inherit;
    font-size: 12px;
  }
  #who { font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) {
    body { padding-top: 48px; font-size: 14px; }
    header { padding: 8px 12px; gap: 10px; }
    header h1 { font-size: 15px; white-space: nowrap; }
    .badge { display: none; }
    button { padding: 7px 11px; }
    #log { padding: 16px 12px 8px; }
    footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
    #app, #auth { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    #form { gap: 8px; }
    textarea, #auth input, .rate input { font-size: 16px; }
    textarea { padding: 10px 12px; }
    #send { padding: 11px 16px; }
    .msg { margin-bottom: 18px; }
    .capabilities { padding: 14px; }
      }
</style>
</head>
<body>
<header>
  <h1 id="title">База знаний</h1>
  <span class="badge" id="model">—</span>
  <span class="badge" id="index">—</span>
  <div class="spacer"></div>
  <span id="who">гость</span>
  <button id="admin-link" hidden>Админ</button>
  <button id="logout">Выйти</button>
  <button id="clear">Очистить</button>
</header>

<div id="auth">
  <form class="card" id="login-form">
    <h2>Вход в базу знаний</h2>
    <input id="login-user" placeholder="Логин" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Пароль" autocomplete="current-password">
    <button type="submit">Войти</button>
    <div class="err" id="login-err"></div>
  </form>
</div>

<div id="app" hidden>
<div id="log"><div id="log-inner">
  <div class="capabilities" id="capabilities"></div>
  <div class="examples" id="examples"></div>
</div></div>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Задайте вопрос по документации... (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button id="send" type="submit">Спросить</button>
  </form>
  <div class="hint-row">
    <div class="hint">Ответы формируются только по проиндексированной документации. Проверьте источники перед использованием.</div>
  </div>
</footer>
</div>

<script>
const log = document.getElementById('log');
const inner = document.getElementById('log-inner');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const examples = document.getElementById('examples');
const capabilitiesEl = document.getElementById('capabilities');
const history = [];
let busy = false;
let me = { id: null, username: '', role: 'guest' };

const appEl = document.getElementById('app');
const authEl = document.getElementById('auth');

function syncLayout() {
  const header = document.querySelector('header');
  const footer = document.querySelector('#app footer');
  if (header) document.body.style.paddingTop = header.offsetHeight + 'px';
  if (footer && !appEl.hidden) appEl.style.paddingBottom = footer.offsetHeight + 'px';
}
window.addEventListener('resize', syncLayout);
window.addEventListener('orientationchange', syncLayout);
syncLayout();

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {}));
  if (res.status === 401) {
    showLogin();
    throw new Error('Требуется вход');
  }
  return res;
}

function showLogin() {
  authEl.hidden = false;
  appEl.hidden = true;
  document.getElementById('admin-link').hidden = true;
  document.getElementById('who').textContent = 'гость';
}

function showApp(user) {
  me = user;
  authEl.hidden = true;
  appEl.hidden = false;
  document.getElementById('admin-link').hidden = user.role !== 'admin';
  document.getElementById('who').textContent =
    user.username + (user.role === 'admin' ? ' · админ' : '');
  syncLayout();
  document.getElementById('input').focus();
}

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('login-err');
  err.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('login-user').value.trim(),
      password: document.getElementById('login-pass').value
    })
  });
  if (!res.ok) {
    err.textContent = 'Неверный логин или пароль';
    return;
  }
  showApp(await res.json());
  bootstrap();
});

document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  showLogin();
});

document.getElementById('admin-link').addEventListener('click', () => {
  location.href = '/admin';
});

function loadTitle() {
  return fetch('/api/title').then(r => r.json()).then(d => {
    const name = (d && d.title) || 'База знаний';
    document.getElementById('title').textContent = name;
    document.title = name;
  }).catch(() => {});
}

function bootstrap() {
  loadTitle();
  fetch('/health').then(r => r.json()).then(d => {
    document.getElementById('model').textContent = d.llm_model;
    syncLayout();
  });
  fetch('/collection').then(r => r.json()).then(d => {
    document.getElementById('index').textContent = d.exists ? d.points + ' фрагментов' : 'индекс пуст';
  });
  loadPrompts();
  loadCapabilities();
}

fetch('/api/me').then(r => r.json()).then(user => {
  if (user.id) { showApp(user); bootstrap(); } else { showLogin(); }
});

function renderPrompts(items) {
  examples.innerHTML = '';
  if (!items.length) return;
  const title = document.createElement('div');
  title.className = 'examples-title';
  title.textContent = 'Попробуйте спросить:';
  examples.appendChild(title);
  items.forEach(text => {
    const btn = document.createElement('button');
    btn.textContent = text;
    examples.appendChild(btn);
  });
}

function loadPrompts() {
  return fetch('/prompts').then(r => r.json()).then(d => renderPrompts(d.prompts || []))
    .catch(() => renderPrompts([]));
}

function renderCapabilities(groups) {
  capabilitiesEl.innerHTML = '';
  if (!groups || !groups.length) return;
  const title = document.createElement('h2');
  title.textContent = 'Что я умею';
  capabilitiesEl.appendChild(title);
  groups.forEach(group => {
    const box = document.createElement('div');
    box.className = 'group';
    const groupTitle = document.createElement('div');
    groupTitle.className = 'group-title';
    groupTitle.textContent = group.title;
    const list = document.createElement('ul');
    group.items.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      list.appendChild(li);
    });
    box.append(groupTitle, list);
    capabilitiesEl.appendChild(box);
  });
}

function loadCapabilities() {
  return fetch('/capabilities').then(r => r.json()).then(d => renderCapabilities(d.groups || []))
    .catch(() => renderCapabilities([]));
}

function scroll() { log.scrollTop = log.scrollHeight; }

function addUser(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = '<div class="who">Вы</div>';
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  el.appendChild(body);
  inner.appendChild(el);
  scroll();
}

function addBot() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = '<div class="who">Ассистент</div>';
  const body = document.createElement('div');
  body.className = 'body';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  body.appendChild(cursor);
  const status = document.createElement('div');
  status.className = 'status';
  const sources = document.createElement('details');
  sources.className = 'sources';
  const rate = document.createElement('div');
  rate.className = 'rate';
  rate.hidden = true;
  const reference = document.createElement('div');
  reference.className = 'reference';
  reference.hidden = true;
  el.append(body, status, reference, sources, rate);
  inner.append(el);
  scroll();
  return { body, cursor, status, reference, sources, rate, suggestions: null, requestId: null };
}

function buildRate(box, requestId) {
  while (box.firstChild) box.removeChild(box.firstChild);
  box.hidden = false;
  const up = document.createElement('button');
  up.textContent = '👍';
  const down = document.createElement('button');
  down.textContent = '👎';
  const comment = document.createElement('input');
  comment.placeholder = 'Комментарий (необязательно)';
  const sendComment = document.createElement('button');
  sendComment.textContent = 'Отправить';

  let vote = null;
  let saved = false;

  async function send() {
    const res = await fetch('/api/rate/' + requestId, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ vote, comment: comment.value })
    });
    if (!res.ok) return false;
    const data = await res.json().catch(() => ({}));
    saved = true;
    comment.disabled = true;
    comment.value = '';
    sendComment.disabled = true;
    sendComment.textContent = 'Отправлено';
    up.disabled = true;
    down.disabled = true;
    return true;
  }

  async function save(nextVote) {
    vote = vote === nextVote ? null : nextVote;
    up.classList.toggle('active', vote === 'up');
    down.classList.toggle('active', vote === 'down');
    if (!vote) return;
    send();
  }

  const note = document.createElement('div');
  note.className = 'muted';

  up.addEventListener('click', () => { if (!saved) save('up'); });
  down.addEventListener('click', () => { if (!saved) save('down'); });
  sendComment.addEventListener('click', () => {
    if (!vote) {
      note.textContent = 'Сначала поставьте оценку: 👍 или 👎';
      return;
    }
    send();
  });
  box.append(up, down, comment, sendComment, note);
}

function scoreTag(score) {
  if (score >= 0.85) return { text: 'высокая релевантность', cls: 'high' };
  if (score >= 0.7) return { text: 'средняя релевантность', cls: 'mid' };
  return { text: 'низкая релевантность', cls: 'low' };
}

function sourceTitle(s) {
  if (s.title) return s.title;
  const name = (s.source || '').split('/').pop();
  return name.replace(/\.[a-z0-9]+$/i, '').replace(/_/g, ' ');
}

function renderSources(el, sources) {
  if (!sources.length) return;
  const summary = document.createElement('summary');
  summary.textContent = 'Источники (' + sources.length + ') · подробнее';
  const items = sources.map(s => {
    const item = document.createElement('div');
    item.className = 'src';

    const head = document.createElement('div');
    head.className = 'src-head';
    const title = document.createElement('span');
    title.className = 'src-title';
    title.textContent = sourceTitle(s);
    head.appendChild(title);

    const tags = document.createElement('div');
    tags.className = 'src-tags';
    const rel = scoreTag(s.score);
    const score = el_tag('tag ' + rel.cls, rel.text + ' · ' + s.score);
    tags.appendChild(score);
    tags.appendChild(el_tag('tag', s.kind === 'web' ? 'страница сайта' : 'документация'));
    if (s.page) tags.appendChild(el_tag('tag', 'с. ' + s.page));
    else if (s.kind !== 'web') tags.appendChild(el_tag('tag', 'страница не определена'));
    if (s.url) {
      const link = el_tag('tag web', 'открыть оригинал');
      link.style.cursor = 'pointer';
      link.addEventListener('click', e => {
        e.stopPropagation();
        window.open(s.url, '_blank', 'noopener');
      });
      tags.appendChild(link);
    }
    head.appendChild(tags);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = s.citation;

    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = s.text;

    const more = document.createElement('button');
    more.className = 'src-more';
    more.textContent = 'Показать полностью';
    more.addEventListener('click', e => {
      e.stopPropagation();
      const open = item.classList.toggle('open');
      more.textContent = open ? 'Свернуть' : 'Показать полностью';
    });

    item.append(head, meta, txt, more);
    item.addEventListener('click', () => {
      const open = item.classList.toggle('open');
      more.textContent = open ? 'Свернуть' : 'Показать полностью';
    });
    return item;
  });
  while (el.firstChild) el.removeChild(el.firstChild);
  el.appendChild(summary);
  items.forEach(item => el.appendChild(item));
}

function el_tag(className, text) {
  const node = document.createElement('span');
  node.className = className;
  node.textContent = text;
  return node;
}

function renderSuggestions(items) {
  const box = document.createElement('div');
  box.className = 'examples';
  box.id = 'suggestions';
  if (!items.length) return box;
  const title = document.createElement('div');
  title.className = 'examples-title';
  title.textContent = 'Примеры вопросов по вашей базе знаний:';
  box.appendChild(title);
  items.forEach(text => {
    const btn = document.createElement('button');
    btn.textContent = text;
    box.appendChild(btn);
  });
  box.addEventListener('click', e => {
    if (e.target.tagName === 'BUTTON') ask(e.target.textContent);
  });
  return box;
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true;
  send.disabled = true;
  examples.remove();

  addUser(question);
  history.push({ role: 'user', content: question });

  const ui = addBot();
  const answerEl = document.createElement('div');
  let answer = '';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const event = JSON.parse(line.slice(5));
        if (event.type === 'token') {
          answer += event.data;
          ui.body.textContent = answer;
          ui.cursor.remove();
          ui.body.appendChild(ui.cursor);
          scroll();
        } else if (event.type === 'prompts') {
          const previous = document.getElementById('suggestions');
          if (previous) previous.remove();
          ui.suggestions = renderSuggestions(event.data || []);
          inner.appendChild(ui.suggestions);
          scroll();
        } else if (event.type === 'reference') {
          const ref = event.data || {};
          if (ref.doc_name) {
            ui.reference.hidden = false;
            const label = ref.doc_ref || ref.doc_name;
            const href = ref.doc_url || '';
            ui.reference.textContent = 'Документация: ';
            if (href) {
              const link = document.createElement('a');
              link.href = href;
              link.textContent = label;
              link.target = '_blank';
              link.rel = 'noopener';
              ui.reference.appendChild(link);
            } else {
              ui.reference.appendChild(document.createTextNode(label));
            if (event.data.author || event.data.updated_at) {
              const meta = document.createElement('div');
              meta.className = 'ref-meta';
              meta.textContent = 'Исправил: ' + (event.data.author || 'администратор') +
                (event.data.updated_at ? ' · ' + event.data.updated_at : '');
              ui.reference.appendChild(meta);
            }
            }
          }
        } else if (event.type === 'request') {
          ui.requestId = event.data.request_id;
        } else if (event.type === 'sources') {
          renderSources(ui.sources, event.data);
        } else if (event.type === 'meta') {
          ui.status.innerHTML = event.data.corrected
            ? '<span class="corrected">Ответ скорректирован администратором</span>'
            : (event.data.grounded
              ? '<span class="grounded">Ответ основан на документации</span>'
              : '<span class="ungrounded">В документации нет прямого ответа</span>');
        } else if (event.type === 'error') {
          ui.status.textContent = event.data;
        }
      }
    }
  } catch (err) {
    ui.status.textContent = 'Ошибка: ' + err.message;
  } finally {
    ui.cursor.remove();
    if (!answer) ui.body.textContent = '—';
    if (ui.requestId) buildRate(ui.rate, ui.requestId);
    history.push({ role: 'assistant', content: answer });
    busy = false;
    send.disabled = false;
    scroll();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  input.value = '';
  input.style.height = 'auto';
  ask(text);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

examples.addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') ask(e.target.textContent);
});

document.getElementById('clear').addEventListener('click', () => {
  history.length = 0;
  inner.innerHTML = '';
  inner.append(capabilitiesEl, examples);
  renderPrompts([]);
  loadPrompts();
  loadCapabilities();
});

if (!appEl.hidden) input.focus();
</script>
</body>
