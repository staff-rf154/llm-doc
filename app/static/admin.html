<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Админка</title></head><body>
<nav>
  <button data-tab="overview" class="active">Обзор</button>
  <button data-tab="users">Пользователи</button>
  <button data-tab="requests">Оценки и правки</button>
  <button data-tab="corrections">Исправления</button>
  <button data-tab="synonyms">Синонимы</button>
  <button data-tab="train">Обучение</button>
  <button data-tab="autolearn">Автообучение</button>
  <button data-tab="settings">Настройки</button>
  <button data-tab="models">Модели</button>
  <button data-tab="domains">Сфера деятельности</button>
  <button data-tab="docs">Документация</button>
  <button data-tab="index">Индексация</button>
</nav>
<main>
  <section id="tab-overview" class="tab">1</section>
  <section id="tab-users" class="tab hidden">2</section>
  <section id="tab-requests" class="tab hidden">3</section>
  <section id="tab-corrections" class="tab hidden">4</section>
  <section id="tab-synonyms" class="tab hidden">5</section>
  <section id="tab-train" class="tab hidden">6</section>
  <section id="tab-autolearn" class="tab hidden">7</section>
  <section id="tab-settings" class="tab hidden">8</section>
  <section id="tab-domains" class="tab hidden">9</section>
  <section id="tab-docs" class="tab hidden">10</section>
  <section id="tab-models" class="tab hidden">11</section>
  <section id="tab-index" class="tab hidden">12</section>
</main>
<script>
const state = { reqFilter: '', reqSearch: '', reqUser: '', reqSort: 'date', reqOrder: 'desc' };
const REQ_PAGE_SIZE = 10;
let reqPage = 1;
const reqOpen = new Set();

function j(url, options) {
  return fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {}))
    .then(async res => {
      if (res.status === 401 || res.status === 403) { location.href = '/'; throw new Error('no access'); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
      return data;
    });
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  (children || []).forEach(c => node.appendChild(c));
  return node;
}

function applyNav() {
  if (currentUser && currentUser.role !== 'system') {
    document.querySelectorAll('nav button[data-tab="models"], nav button[data-tab="domains"]').forEach(b => b.style.display = 'none');
  } else {
    document.querySelectorAll('nav button[data-tab="models"], nav button[data-tab="domains"]').forEach(b => b.style.display = '');
  }
}
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!currentUser) { loadMe().then(applyNav); }
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab').forEach(s => s.classList.add('hidden'));
    const sec = document.getElementById('tab-' + btn.dataset.tab);
    if (sec) sec.classList.remove('hidden');
    applyNav();
    loadTab(btn.dataset.tab);
  });
});
loadMe().then(applyNav);

function loadTab(tab) {
  if (tab === 'overview') loadOverview();
  if (tab === 'users') loadUsers();
  if (tab === 'requests') { fillRequestUsers(); loadRequests(); }
  if (tab === 'corrections') loadCorrections();
  if (tab === 'synonyms') loadSynonyms();
  if (tab === 'train') { loadLessons(); loadTraining(); }
  if (tab === 'autolearn') { loadAutolearn(); loadQuestionGen(); loadBootstrap(); }
  if (tab === 'settings') { loadSettings(); loadCapabilities(); loadDomain(); loadImages(); loadEval(); }
  if (tab === 'domains') loadDomains();
  if (tab === 'models') loadModels();
  if (tab === 'index') { loadIndex(); loadSites(); }
  if (tab === 'docs') loadDocs();
}

document.getElementById('back').addEventListener('click', () => location.href = '/');
document.getElementById('logout').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
});

let currentUser = null;
async function loadMe() {
  try {
    const r = await fetch('/api/user');
    if (r.ok) { currentUser = await r.json(); }
  } catch (e) {}
}
async function loadOverview() {
  if (!currentUser) await loadMe();
  const data = await j('/api/admin/stats');
  const s = data.summary;
  const root = document.getElementById('tab-overview');
  while (root.firstChild) root.removeChild(root.firstChild);

  const stats = el('div', { className: 'card' }, [
    el('h2', { textContent: 'Сводка' }),
    el('div', { className: 'grid' }, [
      stat(s.users, 'пользователей'),
      stat(s.requests, 'запросов'),
      stat(s.likes, 'лайков'),
      stat(s.dislikes, 'дизлайков'),
      stat(s.corrections, 'исправлений'),
      stat(s.active_corrections, 'активных исправлений'),
      stat(s.verified || 0, 'подтверждено документацией'),
      stat(s.review || 0, 'требует проверки')
    ])
  ]);
  root.appendChild(stats);

  const byUser = el('div', { className: 'card' }, [el('h2', { textContent: 'Запросы по пользователям' })]);
  const t1 = el('table', {}, [el('thead', {}, [el('tr', {}, [
    el('th', { textContent: 'Пользователь' }), el('th', { textContent: 'Роль' }),
    el('th', { textContent: 'Запросов' }), el('th', { textContent: '👍' }),
    el('th', { textContent: '👎' }), el('th', { textContent: 'Последний запрос' })
  ])])]);
  const b1 = el('tbody');
  data.by_user.forEach(u => b1.appendChild(el('tr', {}, [
    el('td', { textContent: u.username }),
    el('td', { textContent: u.role }),
    el('td', { textContent: u.requests }),
    el('td', { textContent: u.likes }),
    el('td', { textContent: u.dislikes }),
    el('td', { textContent: u.last_request || '—' })
  ])));
  t1.appendChild(b1);
  byUser.appendChild(t1);
  root.appendChild(byUser);

  const maxDay = Math.max(1, ...data.by_day.map(d => d.requests));
  const byDay = el('div', { className: 'card' }, [el('h2', { textContent: 'Запросы по дням' })]);
  data.by_day.forEach(d => {
    const row = el('div', {}, [
      el('div', { className: 'muted', textContent: d.day + ' · ' + d.requests + ' · ' + d.users + ' польз.' })
    ]);
    const bar = el('div', { className: 'bar' }, [
      el('div', { style: 'width:' + Math.round(100 * d.requests / maxDay) + '%' })
    ]);
    byDay.append(row, bar);
  });
  root.appendChild(byDay);

  const top = el('div', { className: 'card' }, [el('h2', { textContent: 'Топ вопросов' })]);
  const t3 = el('table', {}, [el('thead', {}, [el('tr', {}, [
    el('th', { textContent: 'Вопрос' }), el('th', { textContent: 'Раз' }),
    el('th', { textContent: '👍' }), el('th', { textContent: '👎' })
  ])])]);
  const b3 = el('tbody');
  data.top_questions.forEach(q => b3.appendChild(el('tr', {}, [
    el('td', { textContent: q.question }), el('td', { textContent: q.n }),
    el('td', { textContent: q.likes }), el('td', { textContent: q.dislikes })
  ])));
  t3.appendChild(b3);
  top.appendChild(t3);
  root.appendChild(top);
}

function stat(n, title) {
  return el('div', { className: 'stat' }, [
    el('div', { className: 'n', textContent: String(n) }),
    el('div', { className: 't', textContent: title })
  ]);
}

async function loadUsers() {
  const data = await j('/api/admin/users');
  const body = document.querySelector('#users-table tbody');
  while (body.firstChild) body.removeChild(body.firstChild);
  const msg = document.getElementById('users-msg');
  data.users.forEach(u => {
    body.appendChild(el('tr', {}, [
      el('td', { textContent: u.id }),
      el('td', { textContent: u.username }),
      el('td', {}, [el('span', { className: 'pill ' + (u.role === 'admin' ? 'admin' : ''), textContent: u.role })]),
      el('td', { textContent: u.active ? 'активен' : 'отключён' }),
      el('td', { textContent: u.requests }),
      el('td', { textContent: u.likes }),
      el('td', { textContent: u.dislikes }),
      el('td', { textContent: u.last_request || '—' }),
      el('td', {}, [
        el('button', { textContent: 'Пароль', onclick: () => resetPassword(u.id) }),
        el('button', { textContent: u.active ? 'Отключить' : 'Включить', onclick: () => toggleUser(u.id, !u.active) }),
        el('button', {
          textContent: u.role === 'admin' ? 'Сделать user' : 'Сделать admin',
          onclick: () => changeRole(u.id, u.role === 'admin' ? 'user' : 'admin')
        }),
        el('button', { className: 'danger', textContent: 'Удалить', onclick: () => removeUser(u.id, u.username) })
      ])
    ]));
  });
  msg.textContent = '';
}

document.getElementById('create-user').addEventListener('click', async () => {
  const msg = document.getElementById('users-msg');
  try {
    await j('/api/admin/users', {
      method: 'POST',
      body: JSON.stringify({
        username: document.getElementById('new-username').value.trim(),
        password: document.getElementById('new-password').value,
        role: document.getElementById('new-role').value
      })
    });
    msg.textContent = 'Пользователь создан';
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    loadUsers();
  } catch (err) { msg.textContent = err.message; }
});

async function resetPassword(id) {
  const password = prompt('Новый пароль');
  if (!password) return;
  await j('/api/admin/users/reset-password', { method: 'POST', body: JSON.stringify({ user_id: id, password }) });
  loadUsers();
}

async function toggleUser(id, active) {
  await j('/api/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ active }) });
  loadUsers();
}

async function changeRole(id, role) {
  await j('/api/admin/users/' + id, { method: 'PATCH', body: JSON.stringify({ role }) });
  loadUsers();
}

async function removeUser(id, username) {
  if (!confirm('Удалить пользователя ' + username + '?')) return;
  await j('/api/admin/users/' + id, { method: 'DELETE' });
  loadUsers();
}

document.getElementById('req-filter').addEventListener('change', e => {
  state.reqFilter = e.target.value;
  reqPage = 1;
  loadRequests();
});
document.getElementById('req-sort').addEventListener('change', e => {
  state.reqSort = e.target.value;
  reqPage = 1;
  loadRequests();
});
document.getElementById('req-order').addEventListener('click', () => {
  state.reqOrder = state.reqOrder === 'desc' ? 'asc' : 'desc';
  document.getElementById('req-order').textContent =
    state.reqOrder === 'desc' ? '↓ по убыванию' : '↑ по возрастанию';
  reqPage = 1;
  loadRequests();
});
document.getElementById('req-search').addEventListener('input', e => {
  state.reqSearch = e.target.value;
  reqPage = 1;
});
document.getElementById('req-reload').addEventListener('click', () => { reqPage = 1; loadRequests(); });

async function loadRequests() {
  const params = new URLSearchParams({
    limit: String(REQ_PAGE_SIZE),
    offset: String((reqPage - 1) * REQ_PAGE_SIZE),
    sort: state.reqSort,
    order: state.reqOrder
  });
  if (state.reqFilter) params.set('vote', state.reqFilter);
  if (state.reqSearch) params.set('search', state.reqSearch);
  if (state.reqUser === '__system__') params.set('origin', 'api');
  else if (state.reqUser) params.set('username', state.reqUser);
  const data = await j('/api/admin/requests?' + params.toString());
  const list = document.getElementById('req-list');
  while (list.firstChild) list.removeChild(list.firstChild);
  const pages = Math.max(1, Math.ceil((data.total || 0) / REQ_PAGE_SIZE));
  if (reqPage > pages) reqPage = pages;
  list.appendChild(el('div', { className: 'muted', textContent: 'Всего: ' + data.total }));
  data.items.forEach(item => {
    const vote = item.vote
      ? el('span', { className: 'pill ' + item.vote, textContent: item.vote === 'up' ? '👍' : '👎' })
      : el('span', { className: 'muted', textContent: 'без оценки' });
    const author = item.is_system ? 'системный запрос' : (item.username || 'гость');
    const open = reqOpen.has(item.id);
    const body = el('div', { className: 'lesson-body' }, [
      el('div', { className: 'a', textContent: item.answer }),
      el('div', {}, [
        vote,
        item.corrected ? el('span', { className: 'pill admin', textContent: 'исправленный' }) : document.createTextNode(''),
        item.correction_id
          ? el('button', {
            className: 'pill admin',
            style: 'cursor:pointer',
            textContent: 'открыть исправление #' + item.correction_id,
            onclick: () => jumpToCorrection(item.correction_id)
          })
          : document.createTextNode('')
      ]),
      item.rating_comment ? el('div', { className: 'muted', textContent: 'Комментарий: ' + item.rating_comment }) : document.createTextNode(''),
      el('div', { className: 'row' }, [
        el('button', { textContent: 'Исправить ответ', onclick: () => editAnswer(item) })
      ])
    ]);
    if (!open) body.classList.add('hidden');
    const head = el('div', { className: 'lesson-head' }, [
      el('span', { className: 'mark', textContent: open ? '▾' : '▸' }),
      el('span', { className: 'q', textContent: item.question }),
      item.is_system ? el('span', { className: 'muted', textContent: 'системный' }) : document.createTextNode('')
    ]);
    head.addEventListener('click', () => {
      if (reqOpen.has(item.id)) reqOpen.delete(item.id);
      else reqOpen.add(item.id);
      loadRequests();
    });
    list.appendChild(el('div', { className: 'card' }, [
      el('div', { className: 'muted', textContent: item.created_at + ' · ' + author + ' · ' + item.latency_ms + ' мс · ' + item.sources + ' источников' }),
      head,
      body
    ]));
  });

  const pager = document.getElementById('req-pager');
  while (pager.firstChild) pager.removeChild(pager.firstChild);
  if (pages < 2) return;
  pager.appendChild(el('button', {
    textContent: 'Назад',
    disabled: reqPage === 1,
    onclick: () => { reqPage -= 1; loadRequests(); }
  }));
  pager.appendChild(el('span', { className: 'muted', textContent: 'Страница ' + reqPage + ' из ' + pages }));
  pager.appendChild(el('button', {
    textContent: 'Вперёд',
    disabled: reqPage === pages,
    onclick: () => { reqPage += 1; loadRequests(); }
  }));
}

async function fillRequestUsers() {
  const select = document.getElementById('req-user');
  const previous = select.value;
  let users = [];
  try { users = (await j('/api/admin/users')).users || []; } catch (err) { return; }
  while (select.firstChild) select.removeChild(select.firstChild);
  select.appendChild(el('option', { value: '', textContent: 'Все пользователи' }));
  select.appendChild(el('option', { value: '__system__', textContent: 'Системные (не из web)' }));
  users.forEach(u => select.appendChild(el('option', { value: u.username, textContent: u.username })));
  select.value = previous;
}

document.getElementById('req-user').addEventListener('change', e => {
  state.reqUser = e.target.value;
  reqPage = 1;
  loadRequests();
});

function editAnswer(item) {
  const box = document.getElementById('req-list');
  const wrap = el('div', { className: 'edit' });
  const answer = el('textarea');
  answer.value = item.answer;
  const question = el('input');
  question.value = item.question;
  const docSelect = el('select', { style: 'max-width:320px' });
  const pages = el('input', { placeholder: 'Страницы, например 12-15', style: 'max-width:180px' });
  const extractBtn = el('button', { textContent: 'Подставить текст страниц' });
  const extractRow = el('div', { className: 'row' }, [docSelect, pages, extractBtn]);
  const saveBtn = el('button', { className: 'primary', textContent: 'Сохранить исправление' });
  const note = el('div', { className: 'muted' });

  fillDocumentSelect(docSelect, item.doc_name || '').then(() => {
    pages.value = item.doc_pages || '';
    note.textContent = item.doc_ref
      ? 'Текущая ссылка: ' + item.doc_ref
      : 'Укажите документ и страницы — они обязательны при правке ответа';
  });

  extractBtn.addEventListener('click', async () => {
    if (!docSelect.value || !pages.value.trim()) { note.textContent = 'Укажите документ и страницы'; return; }
    try {
      const data = await extractPages(docSelect.value, pages.value.trim());
      answer.value = answer.value ? answer.value + '\n\n' + data.text : data.text;
      note.textContent = 'Текст страниц подставлен: ' + data.doc_ref;
    } catch (err) { note.textContent = err.message; }
  });

  saveBtn.addEventListener('click', async () => {
    const docName = docSelect.value;
    const docPages = pages.value.trim();
    if (!docName || !docPages) {
      note.textContent = 'Документ и номера страниц обязательны';
      return;
    }
    try {
      const saved = await j('/api/admin/corrections/by-question', {
        method: 'POST',
        body: JSON.stringify({
          question: question.value,
          answer: answer.value,
          doc_name: docName,
          doc_pages: docPages
        })
      });
      wrap.innerHTML = '';
      wrap.append(
        el('div', { className: 'muted' }, [
          document.createTextNode('Ответ сохранён в исправления: #' + saved.id + ' — ' + saved.doc_ref + '. Урок обучения создан автоматически.')
        ]),
        el('div', { className: 'row' }, [
          el('button', {
            className: 'primary',
            textContent: 'Показать в разделе «Исправления»',
            onclick: () => jumpToCorrection(saved.id)
          }),
          el('button', { textContent: 'Закрыть', onclick: () => wrap.remove() })
        ])
      );
      loadRequests();
    } catch (err) { note.textContent = err.message; }
  });

  wrap.append(el('div', { className: 'muted' }, [
    document.createTextNode('Исправление появится в разделе «Исправления» и будет отдаваться пользователям на этот вопрос.')
  ]));

  wrap.append(question, extractRow, answer, el('div', { className: 'row' }, [
    saveBtn,
    el('button', { textContent: 'Отмена', onclick: () => wrap.remove() })
  ]), note);
  box.insertBefore(wrap, box.firstChild);
  wrap.scrollIntoView({ block: 'start' });
}

let imageTimer = null;

let crawlTimer = null;
let sitesData = [];

async function loadSites() {
  const data = await j('/api/admin/sites');
  sitesData = data.sites || [];
  const body = document.querySelector('#site-table tbody');
  while (body.firstChild) body.removeChild(body.firstChild);
  sitesData.forEach((site, index) => {
    body.appendChild(el('tr', {}, [
      el('td', { textContent: site.url }),
      el('td', { textContent: site.enabled ? 'включён' : 'выключен' }),
      el('td', { textContent: site.max_pages || 'общий лимит (' + (data.max_pages || 0) + ')' }),
      el('td', {}, [
        el('button', {
          textContent: site.enabled ? 'Выключить' : 'Включить',
          onclick: () => toggleSite(index, !site.enabled)
        }),
        el('button', {
          className: 'danger',
          textContent: 'Удалить',
          onclick: () => toggleSite(index, false, true)
        })
      ])
    ]));
  });
  renderCrawl(data.crawl);
}

async function saveSites(items) {
  await j('/api/admin/sites', { method: 'PUT', body: JSON.stringify({ sites: items }) });
  document.getElementById('site-msg').textContent = 'Сохранено';
  loadSites();
}

function toggleSite(index, enabled, remove) {
  const items = sitesData.map((site, i) => {
    if (i === index) return remove ? null : Object.assign({}, site, { enabled });
    return site;
  }).filter(Boolean);
  saveSites(items);
}

document.getElementById('site-add').addEventListener('click', () => {
  const url = document.getElementById('site-url').value.trim();
  if (!url) return;
  const maxRaw = document.getElementById('site-max').value.trim();
  const items = sitesData.concat([{
    url,
    enabled: document.getElementById('site-enabled').checked,
    max_pages: maxRaw ? parseInt(maxRaw, 10) : null
  }]);
  document.getElementById('site-url').value = '';
  document.getElementById('site-max').value = '';
  saveSites(items);
});

function renderCrawl(state) {
  if (!state) return;
  const line = 'статус: ' + state.status + ' | этап: ' + (state.stage || '—') +
    ' | страниц: ' + (state.pages || 0) + ' | чанков: ' + (state.chunks || 0) +
    (state.site ? ' | сайт: ' + state.site : '') +
    (state.error ? ' | ошибка: ' + state.error : '');
  document.getElementById('crawl-state').textContent = line;
  const limit = Math.max(1, (sitesData[0] && sitesData[0].max_pages) || 2000);
  document.getElementById('crawl-bar').style.width = Math.min(100, Math.round(100 * (state.pages || 0) / limit)) + '%';
  const errs = (state.errors || []).length
    ? ' первые ошибки: ' + state.errors.slice(0, 2).join('; ')
    : '';
  document.getElementById('crawl-progress').textContent = line + errs;
  if (state.status === 'running') {
    if (crawlTimer) clearTimeout(crawlTimer);
    crawlTimer = setTimeout(async () => {
      const data = await j('/api/admin/sites');
      renderCrawl(data.crawl);
    }, 3000);
  } else if (crawlTimer) {
    clearTimeout(crawlTimer);
    crawlTimer = null;
  }
}

document.getElementById('crawl-start').addEventListener('click', async () => {
  if (!confirm('Обойти сайты? Страницы сайтов в индексе будут заменены.')) return;
  try {
    await j('/api/admin/sites/start', { method: 'POST' });
    document.getElementById('crawl-state').textContent = 'запуск…';
    loadSites();
  } catch (err) {
    document.getElementById('crawl-state').textContent = err.message;
  }
});

let trainHistory = [];
let lessonDraft = null;

function trainBubble(role, text) {
  const box = document.createElement('div');
  box.className = 'train-msg ' + (role === 'user' ? 'user' : 'bot');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? 'Вы' : 'Наставник';
  const txt = document.createElement('div');
  txt.className = 'txt';
  txt.textContent = text;
  box.append(who, txt);
  document.getElementById('train-log').appendChild(box);
  document.getElementById('train-log').scrollTop = 1e9;
}

async function sendTrain() {
  const input = document.getElementById('train-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('train-msg').textContent = 'наставник думает…';
  trainBubble('user', text);
  trainHistory.push({ role: 'user', content: text });
  try {
    const data = await j('/api/admin/train/chat', {
      method: 'POST',
      body: JSON.stringify({ history: trainHistory.slice(0, -1), question: text })
    });
    trainBubble('assistant', data.answer);
    trainHistory.push({ role: 'assistant', content: data.answer });
  } catch (err) {
    document.getElementById('train-msg').textContent = err.message;
  }
  document.getElementById('train-msg').textContent = '';
}

document.getElementById('train-form').addEventListener('submit', e => {
  e.preventDefault();
  sendTrain();
});

const LESSON_PAGE_SIZE = 10;
let lessonPage = 1;
const lessonOpen = new Set();

async function loadLessons() {
  const data = await j('/api/admin/lessons');
  const query = document.getElementById('lesson-search').value.trim().toLowerCase();
  const items = (data.items || []).filter(item =>
    !query || item.topic.toLowerCase().includes(query) || item.question.toLowerCase().includes(query));
  document.getElementById('lesson-count').textContent =
    'уроков: ' + data.total + ', активных: ' + data.active
    + (query ? ', найдено: ' + items.length : '');
  const pages = Math.max(1, Math.ceil(items.length / LESSON_PAGE_SIZE));
  if (lessonPage > pages) lessonPage = pages;
  const start = (lessonPage - 1) * LESSON_PAGE_SIZE;
  const list = document.getElementById('lesson-list');
  while (list.firstChild) list.removeChild(list.firstChild);
  items.slice(start, start + LESSON_PAGE_SIZE).forEach(item => {
    const open = lessonOpen.has(item.id);
    const body = el('div', { className: 'lesson-body' }, [
      item.question ? el('div', { className: 'muted', textContent: 'Вопрос: ' + item.question }) : document.createTextNode(''),
      el('div', { textContent: item.answer }),
      item.focus ? el('div', { className: 'focus', textContent: 'Обратить внимание: ' + item.focus }) : document.createTextNode(''),
      el('div', { className: 'muted', textContent: item.author + ' · ' + item.created_at + ' · применён раз: ' + item.uses + (item.status === 'active' ? '' : item.status === 'candidate' ? ' · кандидат' : ' · выключен') }),
      el('div', { className: 'row' }, [
        el('button', {
          textContent: item.status === 'active' ? 'Выключить' : 'Включить',
          onclick: async () => {
            await j('/api/admin/lessons/' + item.id, {
              method: 'PATCH',
              body: JSON.stringify({ status: item.status === 'active' ? 'disabled' : 'active' })
            });
            loadLessons();
          }
        }),
        el('button', {
          className: 'danger',
          textContent: 'Удалить',
          onclick: async () => {
            if (!confirm('Удалить урок?')) return;
            lessonOpen.delete(item.id);
            await j('/api/admin/lessons/' + item.id, { method: 'DELETE' });
            loadLessons();
          }
        })
      ])
    ]);
    if (!open) body.classList.add('hidden');
    const head = el('div', { className: 'lesson-head' }, [
      el('span', { className: 'mark', textContent: open ? '▾' : '▸' }),
      el('span', { className: 'topic', textContent: item.topic }),
      item.status === 'active' ? document.createTextNode('') : el('span', { className: 'muted', textContent: item.status === 'candidate' ? 'кандидат' : 'выключен' })
    ]);
    head.addEventListener('click', () => {
      if (lessonOpen.has(item.id)) lessonOpen.delete(item.id);
      else lessonOpen.add(item.id);
      loadLessons();
    });
    list.appendChild(el('div', { className: 'lesson' }, [head, body]));
  });

  const pager = document.getElementById('lesson-pager');
  while (pager.firstChild) pager.removeChild(pager.firstChild);
  if (pages < 2) return;
  pager.appendChild(el('button', {
    textContent: 'Назад',
    disabled: lessonPage === 1,
    onclick: () => { lessonPage -= 1; loadLessons(); }
  }));
  pager.appendChild(el('span', { className: 'muted', textContent: 'Страница ' + lessonPage + ' из ' + pages }));
  pager.appendChild(el('button', {
    textContent: 'Вперёд',
    disabled: lessonPage === pages,
    onclick: () => { lessonPage += 1; loadLessons(); }
  }));
}

});

function capGroupRow(title, items, index) {
  const titleInput = el('input', { value: title, placeholder: 'Название раздела' });

        onclick: () => { input.parentNode.parentNode.remove(); }
      })
    ]));
  });
  const row = el('div', { className: 'card', style: 'background:var(--panel-2)' }, [
    el('div', { className: 'row' }, [
      el('div', { style: 'flex:1' }, [titleInput]),
      el('button', {

          ]));
        }
      }),
      el('button', {
        className: 'danger',
        textContent: 'Удалить раздел',
        onclick: () => row.remove()
      })
    ]),
    listBox
  ]);

function collectCapabilities() {
  const groups = [];
  document.querySelectorAll('#cap-editor [data-group]').forEach(groupBox => {
    const title = groupBox.querySelector('input').value.trim();
    const items = [];
    groupBox.querySelectorAll('input[data-item]').forEach(input => {
      const value = input.value.trim();
      if (value) items.push(value);
    });
    if (title && items.length) groups.push({ title, items });
  });
  return groups;
}

let verifyTimer = null;

function checkLabel(status) {
  if (status === 'verified') return 'подтверждено';
  if (status === 'review') return 'требует проверки';
  return 'не проверено';
}

function checkClass(status) {
  if (status === 'verified') return 'up';
  if (status === 'review') return 'down';
  return '';
}

  const data = await j('/api/admin/verify');

    ' · требует проверки: ' + (s.review || 0) +
    ' · не проверено: ' + (s.unchecked || 0);
  const extra = data.status === 'running'
    ? ' | сверка идёт: ' + data.done + '/' + data.total
    : (data.status === 'error' ? ' | ошибка: ' + data.error : '');
  document.getElementById('corr-verify-state').textContent = line + extra;
  if (data.status === 'running') {
    if (verifyTimer) clearTimeout(verifyTimer);
    verifyTimer = setTimeout(() => loadVerify().then(loadCorrections), 3000);
  } else if (verifyTimer) {
    clearTimeout(verifyTimer);
    verifyTimer = null;
  }
}

function field(label, id, value) {

  ]);

function area(label, id, value, rows) {

function formatSynonyms(syn) {
  const lines = [];
  Object.keys(syn || {}).forEach(term => {
    const vals = syn[term];
    const list = Array.isArray(vals) ? vals.join(', ') : String(vals || '');
    lines.push(term + ' — ' + list);
  });
  return lines.join('\n');
}
function parseSynonyms(text) {
  const result = {};
  (text || '').split('\n').forEach(line => {
    const clean = line.trim();
    if (!clean) return;
    const parts = clean.split(/\s*[—–-]\s*|[:=]/);
    if (parts.length < 2) return;
    const term = parts[0].trim().toLowerCase();
    const vals = parts.slice(1).join(',').split(',').map(s => s.trim()).filter(Boolean);
    if (term && vals.length) result[term] = vals;
  });
  return result;
}
function formatSettings(settings) {
  const lines = [];
  Object.keys(settings || {}).forEach(k => lines.push(k + '=' + settings[k]));
  return lines.join('\n');
}
function parseSettings(text) {
  const result = {};
  (text || '').split('\n').forEach(line => {
    const clean = line.trim();
    if (!clean) return;
    const parts = clean.split('=');
    if (parts.length < 2) return;
    const key = parts[0].trim();
    const val = parts.slice(1).join('=').trim();
    if (key && val) result[key] = val;
  });
  return result;
}
function splitLines(text) {
  return (text || '').split('\n').map(s => s.trim()).filter(Boolean);
}

function parseCaps(text) {
  const groups = [];
  let current = null;
  (text || '').split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith('-')) {
      if (!current) { current = { title: 'Что я умею', items: [] }; groups.push(current); }
      current.items.push(line.replace(/^-\s*/, ''));
    } else {
      current = { title: line.replace(/:\s*$/, ''), items: [] };
      groups.push(current);
    }
  });
  return groups.filter(g => g.items.length);
}

function formatCaps(groups) {
  const lines = [];
  (groups || []).forEach(group => {
    lines.push(group.title);
    (group.items || []).forEach(item => lines.push('- ' + item));
    lines.push('');
  });
  return lines.join('\n').trim();
}

  return {

function shortText(text, limit) {
  const value = String(text == null ? '' : text);
  return value.length > limit ? value.slice(0, limit) + '…' : value;
}

function paramRow(item) {
  const inputId = 'param-' + item.key;
  let input;
  if (item.key === 'LLM_MODEL' && settingsModels.length) {
    input = el('select', { id: inputId });
    settingsModels.forEach(name => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      input.appendChild(option);
    });
    if (item.value) input.value = item.value;
    if (item.value && settingsModels.indexOf(item.value) === -1) {
      const option = document.createElement('option');
      option.value = item.value;
      option.textContent = item.value + ' (нет на сервере)';
      input.appendChild(option);
      input.value = item.value;
    }
  } else if (item.type === 'prompt') {
    input = el('textarea', {
      id: inputId,
      style: 'width:100%;box-sizing:border-box;min-height:260px;font-family:inherit;line-height:1.45'
    });
    input.value = item.value;
  } else if (item.type === 'bool') {
    input = el('select', { id: inputId });
    [['1', 'Включено'], ['0', 'Выключено']].forEach(pair => {
      const option = document.createElement('option');
      option.value = pair[0];
      option.textContent = pair[1];
      input.appendChild(option);
    });
    input.value = item.value === '0' ? '0' : '1';
  } else {
    input = el('input', { id: inputId });
    input.value = item.value;
    if (item.type === 'float') input.setAttribute('step', '0.05');
    if (item.type === 'int') input.setAttribute('type', 'number');
  }

  const label = el('label', {
    for: inputId,
    style: 'font-weight:500'
  }, [
    document.createTextNode(item.label),
    item.requires_reindex ? el('span', { className: 'pill down', textContent: 'требует переиндексации' }) : document.createTextNode(''),
    item.source === 'domain' ? el('span', { className: 'pill', textContent: 'из сферы' }) : (item.source === 'local' ? el('span', { className: 'pill', textContent: 'локально' }) : document.createTextNode('')),
    item.editable === false ? el('span', { className: 'pill', textContent: 'только чтение' }) : document.createTextNode('')
  ]);

  if (item.editable === false) input.disabled = true;

  const hint = el('div', { className: 'muted' }, [
    document.createTextNode(
      (item.hint ? item.hint + ' · ' : '') + 'по умолчанию: '
      + shortText(item.default, item.type === 'prompt' ? 240 : 400)
    )
  ]);

  const reset = item.editable === false ? document.createTextNode('') : el('button', {
    textContent: 'Сбросить',
    onclick: async () => {
      await j('/api/admin/settings/params/' + encodeURIComponent(item.key) + '/reset', { method: 'POST' });
      loadSettings();
    }
  });

  if (item.type === 'prompt') {
    return el('div', { style: 'display:flex;flex-direction:column;gap:6px;margin-bottom:16px' }, [
      label, hint, input, el('div', {}, [reset])
    ]);
  }

  return el('div', { className: 'row', style: 'align-items:flex-start' }, [
    el('div', { style: 'min-width:260px' }, [label, hint]),
    el('div', { style: 'flex:1;min-width:220px' }, [input]),
    el('div', {}, [reset])
  ]);
}

function renderSynonyms() {
  const query = document.getElementById('syn-search').value.trim().toLowerCase();

      el('td', { textContent: item.synonyms }),

        el('button', { textContent: 'Править', onclick: () => editSynonym(item) }),
        el('button', { className: 'danger', textContent: 'Удалить', onclick: () => removeSynonym(item.term) })
      ])
    ]));

function editSynonym(item) {
  const body = document.querySelector('#syn-table tbody');
  const tr = Array.from(body.children).find(
    row => row.firstChild && row.firstChild.textContent === item.term
  );
  if (!tr) return;
  const cells = tr.children;
  cells[0].textContent = '';
  cells[1].textContent = '';
  const termInput = el('input', { value: item.term });
  const synInput = el('input', { value: item.synonyms });
  cells[0].appendChild(termInput);
  cells[1].appendChild(synInput);
  const actions = cells[4];
  while (actions.firstChild) actions.removeChild(actions.firstChild);
  actions.appendChild(el('button', {
    className: 'primary',
    textContent: 'Сохранить',
    onclick: async () => {
      const msg = document.getElementById('syn-msg');
      try {
        await j('/api/admin/synonyms', {
          method: 'POST',
          body: JSON.stringify({
            term: termInput.value.trim(),
            synonyms: synInput.value.split(',').map(s => s.trim()).filter(Boolean)
          })
        });
        if (item.term !== termInput.value.trim()) await removeSynonym(item.term, true);
        msg.textContent = 'Сохранено';
        await loadSynonyms();
      } catch (err) { msg.textContent = err.message; }
    }
  }));
  actions.appendChild(el('button', { textContent: 'Отмена', onclick: loadSynonyms }));
  tr.scrollIntoView({ block: 'center' });

function formatSize(bytes) {
  if (!bytes) return '—';
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' КБ';
  return (bytes / 1048576).toFixed(1) + ' МБ';
}

        try {
          let saved;
          if (item.editable) {
            saved = await j('/api/admin/docs/' + encodeURIComponent(item.name) + '/index', { method: 'POST' });
          } else {
            saved = await j('/api/admin/docs/restore', {
              method: 'POST',
              body: JSON.stringify({ name: item.name, root: item.root })
            });
          }
          msg.textContent = 'Готово: ' + (saved.chunks != null ? saved.chunks + ' фрагментов' : item.name);
          loadDocs();
        } catch (err) { msg.textContent = err.message; }
      }
    }));
    actions.push(el('button', {
      className: 'danger',
      textContent: 'Удалить',
      onclick: async () => {
        const what = item.editable
          ? 'Удалить файл ' + item.name + ' и его фрагменты из индекса?'
          : 'Исключить ' + item.name + ' из индекса? Файл в data/docs остаётся на диске.';
        if (!confirm(what)) return;
        const msg = document.getElementById('doc-msg');
        try {
          await j('/api/admin/docs/' + encodeURIComponent(item.name) + '?root=' + encodeURIComponent(item.root),
            { method: 'DELETE' });
          msg.textContent = item.editable ? 'Удалено: ' + item.name : 'Исключено из индекса: ' + item.name;
          loadDocs();
        } catch (err) { msg.textContent = err.message; }
      }
    }));
    body.appendChild(el('tr', {}, [
      el('td', { textContent: (item.folder ? item.folder + '/' : '') + item.name }),
      el('td', { textContent: item.format }),
      el('td', { textContent: formatSize(item.size) }),
      el('td', { textContent: item.excluded ? 'исключён' : (item.indexed ? String(item.chunks) : 'не в индексе') }),
      el('td', { textContent: item.modified }),
      el('td', { textContent: item.editable ? 'загружен' : 'документация' }),
      el('td', {}, actions)
    ]));
  });
  renderDocsPager(data.total);
}

function renderDocsPager(total) {
  const pager = document.getElementById('doc-pager');
  while (pager.firstChild) pager.removeChild(pager.firstChild);
  const pages = Math.max(1, Math.ceil(total / docLimit));
  if (docPage > pages) docPage = pages;
  pager.appendChild(el('button', { textContent: 'Назад', disabled: docPage === 1,
    onclick: () => { docPage -= 1; loadDocs(); } }));
  pager.appendChild(el('span', { className: 'muted', textContent: 'Страница ' + docPage + ' из ' + pages + ' (всего ' + total + ')' }));
  pager.appendChild(el('button', { textContent: 'Вперёд', disabled: docPage === pages,
    onclick: () => { docPage += 1; loadDocs(); } }));
}

let modelTimer = null;

async function loadModels() {
  const data = await j('/api/admin/models');
  const dev = data.device || {};
  document.getElementById('mdl-device').textContent =
    'Torch ' + (dev.torch || '—') + ' · CUDA: ' + (dev.cuda ? 'да' + (dev.gpu ? ', ' + dev.gpu : '') + (dev.cuda_version ? ' (' + dev.cuda_version + ')' : '') : 'нет')
    + ' · эмбеддинги: ' + (dev.embedder || '—') + ' · reranker: ' + (dev.reranker || '—');
  const active = data.llm_model;
  const running = new Set((data.running || []).map(r => r.name));
  const body = document.querySelector('#mdl-table tbody');
  while (body.firstChild) body.removeChild(body.firstChild);
  const ollama = data.ollama || {};
  if (!ollama.available) {
    body.appendChild(el('tr', {}, [el('td', { colSpan: 6, className: 'muted', textContent: 'Ollama недоступна: ' + (ollama.error || '') })]));
  }
  (ollama.models || []).forEach(m => {
    const isActive = m.name === active;
    const actions = [];
    if (!isActive) actions.push(el('button', { textContent: 'Выбрать', onclick: () => selectOllama(m.name) }));
    if (running.has(m.name)) actions.push(el('button', { textContent: 'Выгрузить', onclick: () => unloadOllama(m.name) }));
    if (!isActive) actions.push(el('button', { className: 'danger', textContent: 'Удалить', onclick: () => deleteOllama(m.name) }));
    body.appendChild(el('tr', {}, [
      el('td', { textContent: m.name }),
      el('td', { textContent: ((m.params || '') + ' ' + (m.quant || '')).trim() }),
      el('td', { textContent: formatSize(m.size) }),
      el('td', { textContent: (m.modified_at || '').slice(0, 16).replace('T', ' ') }),
      el('td', { textContent: isActive ? 'активна' : (running.has(m.name) ? 'в памяти' : '') }),
      el('td', {}, actions)
    ]));
  });
  const hf = data.hf || {};
  const hfActive = hf.active || {};
  document.getElementById('mdl-hf-dir').textContent =
    'Кэш: ' + (hf.cache_dir || '—') + ' · активные: эмбеддинги ' + (hfActive.embedding || '—')
    + ', reranker ' + (hfActive.reranker || '—') + ', BM25 ' + (hfActive.sparse || '—');
  const hbody = document.querySelector('#mdl-hf-table tbody');
  while (hbody.firstChild) hbody.removeChild(hbody.firstChild);
  (hf.downloaded || []).forEach(name => {
    hbody.appendChild(el('tr', {}, [
      el('td', { textContent: name }),
      el('td', {}, [el('button', { className: 'danger', textContent: 'Удалить из кэша', onclick: () => deleteHf(name) })])
    ]));
  });
  const pull = data.pull || {};
  const progress = document.getElementById('mdl-pull-progress');
  if (pull.status === 'running') {
    progress.style.display = '';
    document.getElementById('mdl-progress').value = pull.percent || 0;
    document.getElementById('mdl-progress-text').textContent =
      pull.model + ': ' + (pull.status_text || 'загрузка') + ' — ' + (pull.percent || 0) + '%';
    if (!modelTimer) modelTimer = setInterval(loadModels, 3000);
  } else {
    if (modelTimer) { clearInterval(modelTimer); modelTimer = null; }
    progress.style.display = pull.status === 'idle' ? 'none' : '';
    if (pull.status === 'error') document.getElementById('mdl-progress-text').textContent = 'Ошибка: ' + pull.error;
    else if (pull.status === 'done') document.getElementById('mdl-progress-text').textContent = 'Готово: ' + pull.model;
  }
}

async function selectOllama(name) {
  try { await j('/api/admin/models/ollama/select', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('mdl-msg').textContent = 'Активная модель: ' + name; loadModels();
  } catch (err) { document.getElementById('mdl-msg').textContent = err.message; }
}

async function unloadOllama(name) {
  try { await j('/api/admin/models/ollama/unload', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('mdl-msg').textContent = 'Выгружена: ' + name; loadModels();
  } catch (err) { document.getElementById('mdl-msg').textContent = err.message; }
}

async function deleteOllama(name) {
  if (!confirm('Удалить модель ' + name + ' с диска?')) return;
  try { await j('/api/admin/models/ollama?name=' + encodeURIComponent(name), { method: 'DELETE' });
    document.getElementById('mdl-msg').textContent = 'Удалена: ' + name; loadModels();
  } catch (err) { document.getElementById('mdl-msg').textContent = err.message; }
}

async function deleteHf(name) {
  if (!confirm('Удалить модель ' + name + ' из кэша?')) return;
  try { await j('/api/admin/models/hf?name=' + encodeURIComponent(name), { method: 'DELETE' });
    document.getElementById('mdl-hf-msg').textContent = 'Удалена из кэша: ' + name; loadModels();
  } catch (err) { document.getElementById('mdl-hf-msg').textContent = err.message; }
}

document.getElementById('mdl-pull').addEventListener('click', async () => {
  const name = document.getElementById('mdl-pull-name').value.trim();
  if (!name) { document.getElementById('mdl-msg').textContent = 'Введите имя модели'; return; }
  try { await j('/api/admin/models/ollama/pull', { method: 'POST', body: JSON.stringify({ name }) });
    document.getElementById('mdl-msg').textContent = 'Загрузка запущена: ' + name; loadModels();
  } catch (err) { document.getElementById('mdl-msg').textContent = err.message; }
});

document.getElementById('mdl-hf-download').addEventListener('click', async () => {
  const kind = document.getElementById('mdl-hf-kind').value;
  const name = document.getElementById('mdl-hf-name').value.trim();
  const msg = document.getElementById('mdl-hf-msg');
  if (!name) { msg.textContent = 'Введите имя модели'; return; }
  msg.textContent = 'Скачиваю ' + name + '…';
  try {
    await j('/api/admin/models/hf/download', { method: 'POST', body: JSON.stringify({ kind, name }) });
    await j('/api/admin/models/hf/select', { method: 'POST', body: JSON.stringify({ kind, name }) });
    msg.textContent = 'Скачано и выбрано: ' + name;
    loadModels();
  } catch (err) { msg.textContent = err.message; }
});

function docAction(url, options, button) {
  const msg = document.getElementById('doc-msg');
  button.disabled = true;
  msg.textContent = 'Выполняю…';
  return j(url, options)
    .then(data => { msg.textContent = data.name ? 'Готово: ' + data.name : 'Готово'; loadDocs(); })
    .catch(err => { msg.textContent = err.message; })
    .finally(() => { button.disabled = false; });
}

document.getElementById('doc-upload').addEventListener('click', () => {
  const input = document.getElementById('doc-file');
  if (!input.files || !input.files.length) {
    document.getElementById('doc-msg').textContent = 'Выберите файл';
    return;
  }
  const form = new FormData();
  form.append('file', input.files[0]);
  const folderSel = document.getElementById('doc-upload-folder');
  const folder = folderSel ? folderSel.value : '';
  if (folder) form.append('folder', folder);
  docAction('/api/admin/docs/upload', { method: 'POST', body: form, headers: {} }, document.getElementById('doc-upload'))
    .then(() => { input.value = ''; });
});

document.getElementById('doc-fetch').addEventListener('click', async () => {
  const text = document.getElementById('doc-urls').value;
  const msg = document.getElementById('doc-urls-msg');
  if (!text.trim()) { msg.textContent = 'Введите ссылки'; return; }
  msg.textContent = 'Скачиваю…';
  try {
    await j('/api/admin/docs/urls', { method: 'POST', body: JSON.stringify({ urls: text }) });
    msg.textContent = 'Готово, файлы загружены';
    document.getElementById('doc-urls').value = '';
    loadDocs();
  } catch (err) { msg.textContent = err.message; }
});

document.getElementById('doc-search').addEventListener('input', () => { docPage = 1; loadDocs(); });

async function loadIndex() {
  if (indexTimer) clearInterval(indexTimer);
  const data = await j('/api/admin/index');
  const percent = data.total ? Math.round(100 * data.done / data.total) : 0;
  document.getElementById('idx-collection').textContent =
    'Активная коллекция: ' + (data.collection_info.collection || '—') + ', точек: ' + data.collection_info.points;
  document.getElementById('idx-state').innerHTML =
    '<span class="muted">Статус: </span><b>' + data.status + '</b>' +
    (data.error ? ' <span style="color:var(--bad)">' + data.error + '</span>' : '') +
    (data.failed_files && data.failed_files.length
      ? ' <span class="muted">ошибок файлов: ' + data.failed_files.length + '</span>' : '');
  document.getElementById('idx-bar').style.width = percent + '%';
  document.getElementById('idx-progress').textContent =
    data.done + ' / ' + data.total + ' чанков, пропущено файлов: ' + data.skipped_files;
  if (data.status === 'running' || data.status === 'paused') indexTimer = setTimeout(loadIndex, 3000);
}

document.getElementById('idx-start').addEventListener('click', async () => { await j('/api/admin/index/start', { method: 'POST' }); loadIndex(); });
document.getElementById('idx-pause').addEventListener('click', async () => { await j('/api/admin/index/pause', { method: 'POST' }); loadIndex(); });
document.getElementById('idx-resume').addEventListener('click', async () => { await j('/api/admin/index/resume', { method: 'POST' }); loadIndex(); });

const VERDICT_LABELS = {
  ok: 'ответ корректен',
  partial: 'неполный ответ',
  wrong: 'ошибка в ответе',
  refused_wrongly: 'напрасно отказал',
  refused: 'отказ',
  unknown: 'без вердикта'
};
const ISSUE_KINDS = {
  downvote: 'дизлайк пользователя',
  refusal: 'отказ при наличии документации',
  no_sources: 'ответ без источников',
  llm_wrong: 'низкий вердикт модели'
};

let alTimer = null;

function verdictPill(verdict) {
  return ['partial', 'wrong', 'refused_wrongly'].includes(verdict) ? 'down' : 'up';
}

function alPill(text, kind) {
  return el('span', { className: 'pill' + (kind ? ' ' + kind : ''), textContent: text });
}

let alEvalPage = 1;
let alEvalLimit = 20;
let alEvalFilter = '';
let alIssuePage = 1;
let alIssueLimit = 20;
const alEvalOpen = new Set();

async function loadAutolearn() {
  if (alTimer) { clearTimeout(alTimer); alTimer = null; }
  const data = await j('/api/admin/autolearn');
  renderAutolearn(data);
  await Promise.all([loadAlEvals(), loadAlIssues()]);
  if (data.job && data.job.status === 'running') alTimer = setTimeout(loadAutolearn, 4000);
}

function renderAutolearn(data) {
  const job = data.job || {};
  const summary = data.summary || {};
  const evals = summary.evals || {};
  const issues = summary.issues || {};

  const stateEl = document.getElementById('al-state');
  if (job.status === 'running') stateEl.textContent = 'идёт анализ: ' + (job.stage || '');
  else if (job.status === 'error') stateEl.textContent = 'ошибка: ' + (job.error || '');
  else if (job.finished_at) stateEl.textContent = 'последний прогон: ' + job.finished_at;
  else stateEl.textContent = 'анализ не запускался';
  document.getElementById('al-bar').style.width = job.status === 'running' ? '100%' : '0%';

  const metrics = document.getElementById('al-metrics');
  while (metrics.firstChild) metrics.removeChild(metrics.firstChild);
  [
    ['Оценено запросов', evals.total || 0],
    ['Проблемных', evals.problems || 0],
    ['Открытых ошибок', issues.open || 0],
    ['Тем', summary.topics || 0],
    ['Уроков-кандидатов', summary.candidates || 0]
  ].forEach(pair => metrics.appendChild(el('span', { className: 'muted', textContent: pair[0] + ': ' + pair[1] })));

  renderAlProcess(job, summary);
  renderAlTopics(data.topics || []);
  renderAlCandidates(data.candidates || []);
  renderAlParams(data.params || []);
}

function renderAlProcess(job, summary) {
  const box = document.getElementById('al-process');
  while (box.firstChild) box.removeChild(box.firstChild);
  const result = job.result || {};
  const rows = [];
  const statusText = job.status === 'running' ? 'идёт'
    : (job.status === 'error' ? 'ошибка' : (job.finished_at ? 'завершён' : 'не запускался'));
  rows.push(['Статус', statusText]);
  if (job.stage) rows.push(['Этап', job.stage]);
  if (job.started_at) rows.push(['Начат', job.started_at]);
  if (job.finished_at) rows.push(['Завершён', job.finished_at]);
  if (job.error) rows.push(['Ошибка', job.error]);
  const labels = {
    evaluated: 'Переоценено запросов', window: 'Окно анализа', topics: 'Построено тем',
    judged: 'Разобрано моделью', errors: 'Ошибок разбора', candidates: 'Собрано уроков-кандидатов',
    problems: 'Проблемных всего', open_issues: 'Открытых ошибок'
  };
  Object.keys(result).forEach(key => rows.push([labels[key] || key, result[key]]));
  const grid = el('div', { className: 'row', style: 'flex-wrap:wrap;gap:18px' });
  rows.forEach(pair => grid.appendChild(el('div', { style: 'min-width:180px' }, [
    el('div', { className: 'muted', textContent: pair[0] }),
    el('div', { style: 'font-weight:600', textContent: String(pair[1]) })
  ])));
  box.appendChild(grid);

  const verdicts = (summary.evals || {}).by_verdict || {};
  const kinds = (summary.issues || {}).by_kind || {};
  const parts = [];
  if (Object.keys(verdicts).length) {
    parts.push('Вердикты: ' + Object.keys(verdicts).map(k => (VERDICT_LABELS[k] || k) + ' — ' + verdicts[k]).join(', '));
  }
  if (Object.keys(kinds).length) {
    parts.push('Типы ошибок: ' + Object.keys(kinds).map(k => (ISSUE_KINDS[k] || k) + ' — ' + kinds[k]).join(', '));
  }
  if (parts.length) box.appendChild(el('div', { className: 'muted', style: 'margin-top:10px', textContent: parts.join(' · ') }));
}

function renderAlTopics(topics) {
  const box = document.getElementById('al-topics');
  while (box.firstChild) box.removeChild(box.firstChild);
  if (!topics.length) { box.appendChild(el('div', { className: 'muted', textContent: 'Ассоциации ещё не построены. Запустите анализ.' })); return; }
  topics.forEach(topic => {
    const head = el('div', { className: 'lesson-head' }, [
      el('div', { className: 'q', textContent: topic.title || '—' }),
      alPill('всего: ' + topic.total),
      alPill('проблемных: ' + topic.problematic, topic.problematic ? 'down' : '')
    ]);
    const body = el('div', { className: 'lesson-body hidden' });
    (topic.members || []).forEach(m => {
      body.appendChild(el('div', { className: 'row', style: 'margin-bottom:4px' }, [
        el('span', { className: 'muted', textContent: '#' + m.request_id + ' · ' + Math.round(100 * m.score) + '%' }),
        el('span', { textContent: m.question }),
        m.verdict ? alPill(VERDICT_LABELS[m.verdict] || m.verdict, verdictPill(m.verdict)) : document.createTextNode('')
      ]));
    });
    head.addEventListener('click', () => body.classList.toggle('hidden'));
    box.appendChild(el('div', { className: 'lesson' }, [head, body]));
  });
}

async function loadAlIssues() {
  const data = await j('/api/admin/autolearn/issues?status=open&limit=' + alIssueLimit
    + '&offset=' + ((alIssuePage - 1) * alIssueLimit));
  renderAlIssues(data.items || [], data.total || 0);
}

function renderAlIssues(items, total) {
  const box = document.getElementById('al-issues');
  while (box.firstChild) box.removeChild(box.firstChild);
  if (!items.length) {
    box.appendChild(el('div', { className: 'muted', textContent: 'Ошибок не найдено.' }));
    renderAlIssuesPager(total);
    return;
  }
  items.forEach(item => {
    const closing = item.lesson_id ? 'закрыто уроком #' + item.lesson_id
      : (item.topic_id ? 'отнесено к теме #' + item.topic_id : 'не закрыто');
    const actions = el('div', { className: 'row', style: 'margin:6px 0 0' }, [
      el('button', { textContent: 'Скрыть', onclick: async () => {
        await j('/api/admin/autolearn/issues/' + item.id + '/dismiss', { method: 'POST' });
        loadAutolearn();
      }}),
      alPill(ISSUE_KINDS[item.kind] || item.kind, 'down'),
      alPill(closing, item.lesson_id ? 'up' : ''),
      item.vote === 'down' ? alPill('👎', 'down') : document.createTextNode('')
    ]);
    box.appendChild(el('div', { className: 'lesson' }, [
      el('div', { className: 'q', textContent: '#' + item.request_id + ' · ' + (item.question || '') }),
      el('div', { className: 'muted', textContent: 'Ответ: ' + (item.answer || '') }),
      el('div', { className: 'muted', textContent: 'Что не так: ' + (item.detail || '—') }),
      actions
    ]));
  });
  renderAlIssuesPager(total);
}

function renderAlIssuesPager(total) {
  const pager = document.getElementById('al-issues-pager');
  while (pager.firstChild) pager.removeChild(pager.firstChild);
  const pages = Math.max(1, Math.ceil(total / alIssueLimit));
  if (pages < 2) return;
  pager.appendChild(el('button', { textContent: 'Назад', disabled: alIssuePage === 1,
    onclick: () => { alIssuePage -= 1; loadAlIssues(); } }));
  pager.appendChild(el('span', { className: 'muted', textContent: 'Страница ' + alIssuePage + ' из ' + pages + ' (всего ' + total + ')' }));
  pager.appendChild(el('button', { textContent: 'Вперёд', disabled: alIssuePage === pages,
    onclick: () => { alIssuePage += 1; loadAlIssues(); } }));
}

function renderAlCandidates(items) {
  const box = document.getElementById('al-candidates');
  while (box.firstChild) box.removeChild(box.firstChild);
  if (!items.length) { box.appendChild(el('div', { className: 'muted', textContent: 'Кандидатов нет.' })); return; }
  items.forEach(item => {
    const actions = el('div', { className: 'row', style: 'margin:6px 0 0' }, [
      el('button', { className: 'primary', textContent: 'Одобрить', onclick: async () => {
        await j('/api/admin/autolearn/lessons/' + item.id + '/approve', { method: 'POST' });
        loadAutolearn();
      }}),
      el('button', { className: 'danger', textContent: 'Отклонить', onclick: async () => {
        await j('/api/admin/autolearn/lessons/' + item.id + '/reject', { method: 'POST' });
        loadAutolearn();
      }})
    ]);
    box.appendChild(el('div', { className: 'lesson' }, [
      el('div', { className: 'topic', textContent: item.topic }),
      el('div', { className: 'muted', textContent: 'Вопрос: ' + item.question }),
      el('div', { className: 'a', textContent: item.answer }),
      item.focus ? el('div', { className: 'muted focus', textContent: 'Обратить внимание: ' + item.focus }) : document.createTextNode(''),
      actions
    ]));
  });
}

async function loadAlEvals() {
  let query = 'limit=' + alEvalLimit + '&offset=' + ((alEvalPage - 1) * alEvalLimit);
  if (alEvalFilter === 'problem') query += '&only_problems=true';
  else if (alEvalFilter) query += '&verdict=' + encodeURIComponent(alEvalFilter);
  const data = await j('/api/admin/autolearn/evals?' + query);
  renderAlEvals(data.items || [], data.total || 0);
}

function renderAlEvals(items, total) {
  const body = document.querySelector('#al-evals-table tbody');
  while (body.firstChild) body.removeChild(body.firstChild);
  document.getElementById('al-eval-total').textContent = 'всего: ' + total;
  if (!items.length) {
    body.appendChild(el('tr', {}, [el('td', { colSpan: 7, className: 'muted', textContent: 'Нет записей по фильтру.' })]));
  }
  items.forEach(item => {
    const id = item.request_id;
    const isOpen = alEvalOpen.has(id);
    const closing = item.lesson
      ? 'урок #' + item.lesson.id + ' (' + (item.lesson.status === 'active' ? 'активен' : 'кандидат') + ')'
      : (item.correction ? 'исправление #' + item.correction.id : '—');
    body.appendChild(el('tr', {}, [
      el('td', { textContent: '#' + id }),
      el('td', { textContent: item.question || '' }),
      el('td', {}, [alPill(VERDICT_LABELS[item.verdict] || item.verdict, verdictPill(item.verdict))]),
      el('td', { textContent: item.method === 'llm' ? 'модель' : 'эвристика' }),
      el('td', { textContent: (item.score === null || item.score === undefined) ? '—' : Number(item.score).toFixed(2) }),
      el('td', { className: 'muted', textContent: closing }),
      el('td', {}, [el('button', { textContent: isOpen ? 'Скрыть' : 'Детали', onclick: () => {
        if (isOpen) alEvalOpen.delete(id); else alEvalOpen.add(id);
        loadAlEvals();
      } })])
    ]));
    if (!isOpen) return;
    const details = [];
    details.push(el('div', { className: 'muted', textContent: 'Обоснование: ' + (item.reason || '—') }));
    if (item.suggested_answer) details.push(el('div', { textContent: 'Предложенный ответ: ' + item.suggested_answer }));
    if (item.answer) details.push(el('div', { className: 'muted', textContent: 'Ответ ассистента: ' + item.answer }));
    details.push(el('div', { className: 'muted', textContent:
      'Оценка пользователя: ' + (item.vote === 'down' ? '👎' : (item.vote === 'up' ? '👍' : 'нет'))
      + ' · пользователь ' + (item.username || '—') + ' · ' + (item.requested_at || '') }));
    if (item.corrected) details.push(el('div', { className: 'muted', textContent: 'Запрос помечен как исправленный' }));
    const issuePills = (item.issues || []).map(x => alPill(ISSUE_KINDS[x.kind] || x.kind, x.status === 'open' ? 'down' : ''));
    if (issuePills.length) details.push(el('div', { className: 'row' }, issuePills));
    details.push(el('div', { className: 'muted', textContent: item.lesson
      ? 'Закрыто уроком: ' + (item.lesson.topic || '')
      : (item.correction ? 'Закрыто исправлением #' + item.correction.id : 'Пока не закрыто ни уроком, ни исправлением') }));
    body.appendChild(el('tr', {}, [el('td', { colSpan: 7 }, [el('div', { style: 'padding:8px 4px' }, details)])]));
  });
  renderAlEvalsPager(total);
}

function renderAlEvalsPager(total) {
  const pager = document.getElementById('al-evals-pager');
  while (pager.firstChild) pager.removeChild(pager.firstChild);
  const pages = Math.max(1, Math.ceil(total / alEvalLimit));
  pager.appendChild(el('button', { textContent: 'Назад', disabled: alEvalPage === 1,
    onclick: () => { alEvalPage -= 1; loadAlEvals(); } }));
  pager.appendChild(el('span', { className: 'muted', textContent: 'Страница ' + alEvalPage + ' из ' + pages }));
  pager.appendChild(el('button', { textContent: 'Вперёд', disabled: alEvalPage === pages,
    onclick: () => { alEvalPage += 1; loadAlEvals(); } }));
}

function renderAlParams(items) {
  const box = document.getElementById('al-params');
  while (box.firstChild) box.removeChild(box.firstChild);
  items.forEach(item => {
    const inputId = 'alp-' + item.key;
    let input;
    if (item.type === 'bool') {
      input = el('select', { id: inputId });
      [['1', 'Включено'], ['0', 'Выключено']].forEach(pair => {
        const option = document.createElement('option');
        option.value = pair[0];
        option.textContent = pair[1];
        input.appendChild(option);
      });
      input.value = item.value === '0' ? '0' : '1';
    } else {
      input = el('input', { id: inputId });
      input.value = item.value;
      if (item.type === 'float') input.setAttribute('step', '0.01');
      if (item.type === 'int') input.setAttribute('type', 'number');
    }
    box.appendChild(el('div', { className: 'row', style: 'align-items:flex-start' }, [
      el('div', { style: 'min-width:260px' }, [
        el('label', { for: inputId, style: 'font-weight:500', textContent: item.label }),
        el('div', { className: 'muted', textContent: (item.hint ? item.hint + ' · ' : '') + 'по умолчанию: ' + item.default })
      ]),
      el('div', { style: 'flex:1;min-width:220px' }, [input])
    ]));
  });
}

document.getElementById('al-eval-size').addEventListener('change', e => {

document.getElementById('al-params-save').addEventListener('click', async () => {

let qgPage = 1;
let qgLimit = 20;
let qgInit = false;
let qgTimer = null;
const qgOpen = new Set();

async function loadQuestionGen() {
  const data = await j('/api/admin/questiongen');
  const job = data.job || {};
  const stateEl = document.getElementById('qg-state');
  if (job.status === 'running') stateEl.textContent = 'идёт: ' + (job.stage || '');
  else if (job.status === 'error') stateEl.textContent = 'ошибка: ' + (job.error || '');
  else if (job.finished_at) stateEl.textContent = 'последний прогон: ' + job.finished_at;
  else stateEl.textContent = 'не запускалось';
  document.getElementById('qg-bar').style.width = job.status === 'running' ? '100%' : '0%';
  applyQuestionGenDefaults(data.defaults || {});
  renderQuestionGenProcess(job, data.summary || {});
  await loadQuestionGenReport();
  if (qgTimer) { clearTimeout(qgTimer); qgTimer = null; }
  if (job.status === 'running') qgTimer = setTimeout(loadQuestionGen, 4000);
}

function applyQuestionGenDefaults(defaults) {
  if (qgInit) return;
  qgInit = true;
  document.getElementById('qg-count').value = defaults.count || 10;
  const sources = defaults.sources || [];
  document.getElementById('qg-docs').checked = sources.includes('docs');
  document.getElementById('qg-topics').checked = sources.includes('topics');
  document.getElementById('qg-domain').checked = sources.includes('domain');
  document.getElementById('qg-judge').checked = !!defaults.judge;
}

function renderQuestionGenProcess(job, summary) {
  const result = job.result || {};
  const box = document.getElementById('qg-metrics');
  while (box.firstChild) box.removeChild(box.firstChild);
  [
    ['Прогнано вопросов', result.ran || 0],
    ['Ответов по документации', result.grounded || 0],
    ['Проблемных', result.problems || 0],
    ['Оценено моделью', result.judged || 0],
    ['Всего сгенерировано', summary.generated || 0]
  ].forEach(pair => box.appendChild(el('span', { className: 'muted', textContent: pair[0] + ': ' + pair[1] })));
  const questions = (job.questions || []).map(item => item.question);
  document.getElementById('qg-questions').textContent = questions.length
    ? 'Вопросы прогона: ' + questions.join(' · ')
    : '';
}

async function loadQuestionGenReport() {
  const data = await j('/api/admin/questiongen/report?limit=' + qgLimit + '&offset=' + ((qgPage - 1) * qgLimit));
  renderQuestionGenReport(data.items || [], data.total || 0);
}

function renderQuestionGenReport(items, total) {
  const body = document.querySelector('#qg-table tbody');
  while (body.firstChild) body.removeChild(body.firstChild);
  if (!items.length) {
    body.appendChild(el('tr', {}, [el('td', { colSpan: 7, className: 'muted', textContent: 'Пока пусто — запустите генерацию.' })]));
  }
  items.forEach(item => {
    const id = item.request_id;
    const isOpen = qgOpen.has(id);
    const closing = item.lesson
      ? 'урок #' + item.lesson.id
      : (item.correction ? 'исправление #' + item.correction.id : '—');
    body.appendChild(el('tr', {}, [
      el('td', { textContent: '#' + id }),
      el('td', { textContent: item.question || '' }),
      el('td', {}, [alPill(VERDICT_LABELS[item.verdict] || item.verdict, verdictPill(item.verdict))]),
      el('td', { textContent: item.method === 'llm' ? 'модель' : 'эвристика' }),
      el('td', { textContent: String(item.sources == null ? 0 : item.sources) }),
      el('td', { className: 'muted', textContent: closing }),
      el('td', {}, [el('button', { textContent: isOpen ? 'Скрыть' : 'Детали', onclick: () => {
        if (isOpen) qgOpen.delete(id); else qgOpen.add(id);
        loadQuestionGenReport();
      } })])
    ]));
    if (!isOpen) return;
    const details = [];
    details.push(el('div', { className: 'muted', textContent: 'Обоснование: ' + (item.reason || '—') }));
    if (item.suggested_answer) details.push(el('div', { textContent: 'Предложенный ответ: ' + item.suggested_answer }));
    if (item.answer) details.push(el('div', { className: 'muted', textContent: 'Ответ ассистента: ' + item.answer }));
    const issuePills = (item.issues || []).map(x => alPill(ISSUE_KINDS[x.kind] || x.kind, x.status === 'open' ? 'down' : ''));
    if (issuePills.length) details.push(el('div', { className: 'row' }, issuePills));
    details.push(el('div', { className: 'muted', textContent: item.lesson
      ? 'Закрыто уроком: ' + (item.lesson.topic || '')
      : (item.correction ? 'Закрыто исправлением #' + item.correction.id : 'Пока не закрыто ни уроком, ни исправлением') }));
    body.appendChild(el('tr', {}, [el('td', { colSpan: 7 }, [el('div', { style: 'padding:8px 4px' }, details)])]));
  });
  const pager = document.getElementById('qg-pager');
  while (pager.firstChild) pager.removeChild(pager.firstChild);
  const pages = Math.max(1, Math.ceil(total / qgLimit));
  pager.appendChild(el('button', { textContent: 'Назад', disabled: qgPage === 1,
    onclick: () => { qgPage -= 1; loadQuestionGenReport(); } }));
  pager.appendChild(el('span', { className: 'muted', textContent: 'Страница ' + qgPage + ' из ' + pages + ' (всего ' + total + ')' }));
  pager.appendChild(el('button', { textContent: 'Вперёд', disabled: qgPage === pages,
    onclick: () => { qgPage += 1; loadQuestionGenReport(); } }));
}

document.getElementById('qg-run').addEventListener('click', async () => {
  const stateEl = document.getElementById('qg-state');
  const sources = [];
  if (document.getElementById('qg-docs').checked) sources.push('docs');
  if (document.getElementById('qg-topics').checked) sources.push('topics');
  if (document.getElementById('qg-domain').checked) sources.push('domain');
  if (!sources.length) { stateEl.textContent = 'выберите хотя бы один источник'; return; }
  const body = {
    count: parseInt(document.getElementById('qg-count').value, 10) || 10,
    sources: sources,
    judge: document.getElementById('qg-judge').checked
  };
  try {
    stateEl.textContent = 'запускаю…';
    await j('/api/admin/questiongen/run', { method: 'POST', body: JSON.stringify(body) });
    loadQuestionGen();
  } catch (err) { stateEl.textContent = 'ошибка: ' + err.message; }
});

let bsInit = false;
let bsTimer = null;

async function loadBootstrap() {
  const data = await j('/api/admin/bootstrap');
  const job = data.job || {};
  const ready = data.readiness || {};
  document.getElementById('bs-ready').textContent = ready.ready
    ? 'Готово: ' + (ready.domain_title || ready.domain) + ', документов ' + ready.points + ', вопросов ' + ready.questions
    : 'Не готово: нет ' + (!ready.points ? 'документов' : 'вопросов сферы');
  applyBootstrapDefaults(data.params || []);
  const stateEl = document.getElementById('bs-state');
  if (job.status === 'running') stateEl.textContent = 'идёт (цикл ' + (job.cycle || 0) + '/' + (job.cycles || 0) + '): ' + (job.stage || '');
  else if (job.status === 'error') stateEl.textContent = 'ошибка: ' + (job.error || '');
  else if (job.finished_at) stateEl.textContent = 'завершено: ' + job.finished_at;
  else stateEl.textContent = 'не запускалось';
  document.getElementById('bs-bar').style.width = job.status === 'running' ? '100%' : '0%';
  renderBootstrapCycles(job.result || {});
  if (bsTimer) { clearTimeout(bsTimer); bsTimer = null; }
  if (job.status === 'running') bsTimer = setTimeout(loadBootstrap, 4000);
}

function applyBootstrapDefaults(params) {
  if (bsInit) return;
  bsInit = true;
  const map = {};
  params.forEach(p => { map[p.key] = p.value; });
  if (map.BOOTSTRAP_CYCLES != null && map.BOOTSTRAP_CYCLES !== '') document.getElementById('bs-cycles').value = map.BOOTSTRAP_CYCLES;
  if (map.BOOTSTRAP_COUNT != null && map.BOOTSTRAP_COUNT !== '') document.getElementById('bs-count').value = map.BOOTSTRAP_COUNT;
}

function renderBootstrapCycles(result) {
  const cycles = result.cycles || [];
  const body = document.querySelector('#bs-table tbody');
  while (body.firstChild) body.removeChild(body.firstChild);
  if (!cycles.length) {
    body.appendChild(el('tr', {}, [el('td', { colSpan: 6, className: 'muted', textContent: 'Пока не запускалось.' })]));
  }
  cycles.forEach(row => body.appendChild(el('tr', {}, [
    el('td', { textContent: String(row.cycle) }),
    el('td', { textContent: String(row.questions || 0) }),
    el('td', { textContent: String(row.ran || 0) }),
    el('td', { textContent: String(row.grounded || 0) }),
    el('td', { textContent: String(row.problems || 0) }),
    el('td', { textContent: String(row.candidates || 0) })
  ])));
  const metrics = document.getElementById('bs-metrics');
  while (metrics.firstChild) metrics.removeChild(metrics.firstChild);
  const total = cycles.reduce((acc, row) => acc + (row.ran || 0), 0);
  metrics.appendChild(el('span', { className: 'muted', textContent: 'Всего прогнано: ' + total }));
}

document.getElementById('bs-run').addEventListener('click', async () => {
  const stateEl = document.getElementById('bs-state');
  const body = {
    cycles: parseInt(document.getElementById('bs-cycles').value, 10) || 3,
    count: parseInt(document.getElementById('bs-count').value, 10) || 30
  };
  try {
    stateEl.textContent = 'запускаю…';
    const res = await j('/api/admin/bootstrap/run', { method: 'POST', body: JSON.stringify(body) });
    if (res.started === false) stateEl.textContent = 'не запущено: ' + (res.reason || '');
    loadBootstrap();
  } catch (err) { stateEl.textContent = 'ошибка: ' + err.message; }
});
